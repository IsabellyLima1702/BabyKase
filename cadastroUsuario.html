<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./cadastroUsuario.css">

    <title>Cadastro</title>
</head>

<body>

    <header class="detalheCima">
        <img src="img/Fundo Cima.png" alt="Detalhe superior">
    </header>

    <main class="cadastro">

        <div class="inputs">

            <div class="logo-container">
                <img
                    class="logo"
                    src="img/logo.png"
                    alt="Logo"
                >
            </div>

            <div class="campo">
                <input
                    type="text"
                    id="nome"
                    placeholder="Nome:"
                >
            </div>

            <div class="campo">
                <input
                    type="date"
                    id="data"
                    placeholder="Data de nascimento:"
                >
            </div>

            <div class="campo">
                <input
                    type="tel"
                    id="telefone"
                    placeholder="Telefone:"
                >
            </div>

            <div class="campo">
                <input
                    type="email"
                    id="email"
                    placeholder="Email:"
                >
            </div>

           <div class="campo senha-campo">
                <input 
                    type="password" 
                    id="senha" 
                    placeholder="Senha:"
                >  
            </div>

            <div class="campo">
                <input
                    type="password"
                    id="premium"
                    placeholder="Confirmar senha:"
                >
            </div>
         
            <div class="tipo-responsavel">
                <label class="opcao-responsavel">
                    <input
                        type="radio"
                        name="tipoResponsavel"
                        value="mae"
                        required
                    />
                <span>Mãe</span>
            </label>

            <label class="opcao-responsavel">
                <input
                    type="radio"
                    name="tipoResponsavel"
                    value="pai"
                />
                <span>Pai</span>
            </label>

            <label class="opcao-responsavel">
                <input
                    type="radio"
                    name="tipoResponsavel"
                    value="responsavel_legal"
                />
                <span>Responsável legal</span>
            </label>
        </div>

        <div class="privacidade">
    <input type="checkbox" id="privacidade" name="privacidade" required>

    <label for="privacidade">
        Aceito a
        <a href="politicaPrivacidade.html" target="_blank">
            Política de Privacidade
        </a>
    </label>
</div>

            <div class="marcas">

                <img
                    class="google"
                    src="img/google.png"
                    alt="Google"
                >

                <img
                    class="mac"
                    src="img/apple.png"
                    alt="Mac"
                >

                <img
                    class="face"
                    src="img/facebook.png"
                    alt="Facebook"
                >

            </div>

        </div>

        <button id="botao" onclick="register()">Próximo</button>

        <div class="login"> 

    <h3> 
        Já possui uma conta? 
    </h3> 

    <h2 onclick="window.location.href='login.html'"> 
        Login 
    </h2> 

</div>

    </main>

    <div class="detalheBaixo">

        <img
            src="img/Fundo baixo.png"
            alt="Detalhe inferior"
        >

    </div>

    <script src="./cadastroUsuario.js"></script>

</body>

</html>
